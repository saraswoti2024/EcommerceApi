<!DOCTYPE html>
<body>
 <form action="https://rc-epay.esewa.com.np/api/epay/main/v2/form" method="POST">
<label for="amount">Amount:</label>
 <input type="text" id="amount" name="amount" value="{{order_amount}}" required>
 <label for="tax_amount">Tax Amount:</label>
 <input type="text" id="tax_amount" name="tax_amount" value ="{{tax_amount}}" required>
 <label for="total_amount">Total Amount:</label>
 <input type="text" id="total_amount" name="total_amount" value="{{total_amount}}" required>
 <input type="hidden" id="transaction_uuid" name="transaction_uuid" value="{{transaction_uuid}}" required>
 <input type="hidden" id="product_code" name="product_code" value ="EPAYTEST" required>
 <label for="product_service_charge">Product Service Charge:</label>
 <input type="text" id="product_service_charge" name="product_service_charge" value="0" required>
 <label for="product_delivery_charge">Product Delivery Charge:</label>
 <input type="text" id="product_delivery_charge" name="product_delivery_charge" value="0" required>
 <input type="hidden" name="success_url" value="{{ success_url_esewa }}">
<input type="hidden" name="failure_url" value="{{ failure_url_esewa }}">
 <input type="hidden" id="signed_field_names" name="signed_field_names" value="total_amount,transaction_uuid,product_code" required>
 <input type="hidden" id="signature" name="signature" value="{{signature}}" required>
 


 <input value="Submit" type="submit">
 </form>
</body> 
</html>
